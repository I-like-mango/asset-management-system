{% extends "base.html" %}
{% block title %}{{ message.title }}{% endblock %}
{% block content %}
<h3>{{ message.title }}</h3>
<p class="text-muted">{{ message.created_at|date:"Y-m-d H:i" }} · {{ message.get_msg_type_display }}</p>
<div class="card"><div class="card-body">{{ message.content|linebreaks }}</div></div>
<a class="btn btn-link mt-2" href="{% url 'message_list' %}">返回列表</a>
{% endblock %}
