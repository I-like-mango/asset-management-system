{% extends "base.html" %}
{% block title %}审批{% endblock %}
{% block content %}
<h3>{% if action == 'approve' %}通过{% else %}拒绝{% endif %}领用申请</h3>
<p>资产：{{ loan.asset.name }} · 申请人：{{ loan.applicant.username }}</p>
<p class="text-muted">{{ loan.purpose }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">提交</button>
  <a class="btn btn-link" href="{% url 'approval_list' %}">返回</a>
</form>
{% endblock %}
