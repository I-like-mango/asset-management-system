{% extends "base.html" %}
{% block title %}编辑角色 {{ group.name }}{% endblock %}
{% block content %}
<h3 class="mb-3">角色权限：{{ group.name }}</h3>
<div class="card"><div class="card-body">
<form method="post">
  {% csrf_token %}
  <div class="row">
    {% for checkbox in form.permissions %}
    <div class="col-md-4"><label class="form-check">{{ checkbox.tag }} {{ checkbox.choice_label }}</label></div>
    {% endfor %}
  </div>
  <button class="btn btn-primary mt-3" type="submit">保存</button>
  <a class="btn btn-link" href="{% url 'role_list' %}">返回</a>
</form>
</div></div>
{% endblock %}
