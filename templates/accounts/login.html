{% extends "base.html" %}
{% block title %}登录 - IT资产管理{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center">IT办公设备资产管理系统</h4>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <p class="text-muted small mt-3 mb-0">演示账号：admin / admin123，user / user123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
